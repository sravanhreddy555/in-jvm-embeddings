# Folder with model.onnx + vocab.txt (download links in README). Env: MODEL_DIR
model.dir=./models/all-MiniLM-L6-v2
# Max tokens per text; longer text is cut off (256 is what the model was trained with)
model.max-length=256

# A JSON array of {"id", "title", ...text fields}. Env: DATA_PATH
data.path=./data/jobs.json
# Fields that are joined with ". " and embedded. Env: DATA_TEXT_FIELDS
data.text-fields=title,description,requirements

server.port=8080
